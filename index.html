<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de Consumo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
</head>
<body>
    <div class="header-top">
        <h2>Controle de Consumo</h2>
        <button class="btn-icon" onclick="toggleDarkMode()" id="themeBtn">🌙</button>
    </div>

    <!-- Painel Principal -->
    <div class="card summary">
        <div>
            <h3 id="totalCost">R$ 0,00</h3>
            <p>Estimativa Mensal</p>
        </div>
        <div>
            <h3 id="totalKwh">0.0</h3>
            <p>Total em kWh</p>
        </div>
    </div>

    <!-- Ajuste de Tarifa -->
    <div class="card">
        <div class="form-group" style="margin: 0;">
            <label>Tarifa da Distribuidora (R$/kWh)</label>
            <input type="number" id="tarifa" value="0.90" step="0.01" oninput="calculate()">
        </div>
    </div>

    <!-- Formulário -->
    <div class="card">
        <form id="applianceForm" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="editId">
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Cômodo</label>
                    <input type="text" id="comodo" placeholder="Ex: Cozinha" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Aparelho</label>
                    <input type="text" id="aparelho" placeholder="Ex: Geladeira" required>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Potência (W)</label>
                    <input type="number" id="potencia" placeholder="Ex: 200" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Horas de uso/dia</label>
                    <input type="number" id="horas" step="0.01" placeholder="Ex: 10" required>
                </div>
            </div>
            <button type="submit" class="btn-add" id="submitBtn">➕ Adicionar</button>
            <button type="button" class="btn-cancel" id="cancelBtn" onclick="cancelEdit()">❌ Cancelar Edição</button>
        </form>
    </div>

    <!-- Lista -->
    <div class="card">
        <div class="tools-bar">
            <span style="font-weight: bold; font-size: 0.9em; color: var(--text-muted)">Seus Aparelhos</span>
            <button class="btn-sort" onclick="sortByCost()">📊 Ordenar por Custo</button>
        </div>
        <div id="listContainer"></div>
    </div>

    <script src="script.js">
        if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker registrado com sucesso!'))
      .catch(err => console.error('Erro ao registrar Service Worker:', err));
      }
    </script>
</body>
</html>
